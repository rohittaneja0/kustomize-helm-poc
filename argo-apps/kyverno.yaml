apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  destination:
    namespace: kyverno
    server: https://kubernetes.default.svc
  project: default
  sources:
  - chart: kyverno/kyverno
    helm:
    repoURL: https://kyverno.github.io/kyverno/
  - kustomize:
      namespace: kyverno
    path: components/kyverno
    repoURL: https://github.com/rohittaneja0/kustomize-helm-poc
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true